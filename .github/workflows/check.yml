name: check

on:
  schedule:
    # Daily 13:00 UTC (~18:30 Myanmar Standard Time) — after collect
    - cron: "0 13 * * *"
  workflow_dispatch: {}        # manual run: Actions tab → Run workflow

permissions:
  contents: write              # allow the bot to commit generated data

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run check phase
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python -m src.main --phase check

      - name: Commit generated data
        run: |
          git config user.name "information-hub[bot]"
          git config user.email "information-hub[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily check $(date -u +%Y-%m-%d)"
            git push
          fi
