name: scheduler

on:
  schedule:
    # DYNAMIC cron — the pipeline rewrites this line to the next run time
    # (date-specific M H D M *) after every run.  No fixed run times.
    - cron: "53 5 14 8 *"
    # SAFETY fallback — daily 01:00 UTC. Never rewritten; keeps the system
    # alive if a dynamic cron goes stale (e.g. crashed mid-run).
    - cron: "0 1 * * *"
  workflow_dispatch: {}        # manual: run due phases now (or --force-phase)

permissions:
  contents: write              # allow the bot to commit generated data

concurrency:
  group: scheduler
  cancel-in-progress: false    # one scheduler job at a time (git safety)

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run scheduler (due phases + cron update)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python -m src.run.scheduler

      - name: Commit generated data (incl. updated cron)
        run: |
          git config user.name "information-hub[bot]"
          git config user.email "information-hub[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: scheduler run $(date -u +%Y-%m-%dT%H-%M)"
            git pull --rebase origin main || true
            git push
          fi
