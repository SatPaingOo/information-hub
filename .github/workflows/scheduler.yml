name: scheduler

on:
  schedule:
    # Dynamic heartbeat — no fixed run times. Runs every 15 min, reads
    # registry/schedule.json {collect_next_run, check_next_run, target_remaining}
    # and runs a phase only when it is due (provider cooldowns/budgets drive it).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}        # manual: run due phases now (or --force-phase)

permissions:
  contents: write              # allow the bot to commit generated data

concurrency:
  group: scheduler
  cancel-in-progress: false    # one heartbeat job at a time (git safety)

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run scheduler (due phases only)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python -m src.run.scheduler

      - name: Commit generated data
        run: |
          git config user.name "information-hub[bot]"
          git config user.email "information-hub[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: scheduler heartbeat $(date -u +%Y-%m-%dT%H-%M)"
            git pull --rebase origin main || true
            git push
          fi
