name: scheduler

on:
  schedule:
    # DYNAMIC — rewritten by the scheduler to the exact next-run time when a
    # BOT_PAT secret is set.  Never edit this line by hand; the scheduler
    # anchors on the "# DYNAMIC" marker so the entries below are untouched.
    - cron: "57 5 4 9 *"
    # HEARTBEAT — every 15 min, offset OFF the quarter-hour marks.  NEVER
    # REWRITTEN.  Each fire checks data/state/schedule.json and runs whichever
    # phase is due; this is the driver that keeps collecting until the daily
    # target is met and survives GitHub dropping or delaying a single schedule
    # event.  Minutes 0/15/30/45 are GitHub's peak scheduler congestion slots
    # (runs there were delayed ~3-4h or dropped — only 4 fired all day), so
    # the heartbeat uses 4/19/34/49 instead, per GitHub's own advice to
    # schedule away from the top of the hour.  Works with the plain App token.
    - cron: "4-59/15 * * * *"
    # SAFETY fallback — daily 01:00 UTC. Never rewritten; extra redundancy.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force_phase:
        description: "Force a phase now (empty = follow schedule)"
        required: false
        default: ""
        type: choice
        options: ["", "collect", "check"]

permissions:
  contents: write              # allow the bot to commit generated data
  issues: write                # zero-day alert opens tracking issues

# NOTE: the GitHub App token CANNOT modify .github/workflows/*.yml.
# To enable the dynamic cron rewrite, add a `BOT_PAT` secret (fine-grained
# PAT with "Contents: read+write" on this repo) — the commit step uses it
# when present. Without it, data commits still work and the daily-01:00
# safety cron drives the runs (dynamic cron stays at its placeholder).

concurrency:
  group: scheduler
  cancel-in-progress: false    # one scheduler job at a time (git safety)

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run scheduler (due phases + cron update)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          FP="${{ github.event.inputs.force_phase }}"
          if [ -n "$FP" ]; then
            python -m src.run.scheduler --force-phase "$FP"
          else
            python -m src.run.scheduler
          fi

      - name: Commit generated data
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          git config user.name "information-hub[bot]"
          git config user.email "information-hub[bot]@users.noreply.github.com"
          # CRON CHANGE: only pushable by a REAL PAT (classic ghp_ / fine-
          # grained) with Contents write.  The GitHub App token (gho_) and
          # GitHub App secrets CANNOT push workflow files — if BOT_PAT is a
          # GitHub App token (or unset), discard the cron rewrite and let the
          # */15 heartbeat drive runs.  When a real PAT is set, push the cron
          # change FIRST so it lands before the data commit.
          if [ -n "${BOT_PAT:-}" ]; then
            # actions/checkout sets http.https://github.com/.extraheader to the
            # GitHub App token, which OVERRIDES the URL credentials below — the
            # push would still use the App token and GitHub would refuse the
            # workflow-file change.  Drop it so BOT_PAT is actually used.
            git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${BOT_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            git add .github/workflows/scheduler.yml
            if ! git diff --cached --quiet; then
              git commit -m "chore: scheduler cron -> $(grep -oE 'cron: \"[^\"]*\"' .github/workflows/scheduler.yml | head -1)" 2>/dev/null || true
              git push origin main 2>/dev/null || echo "cron push failed — workflow files need a non-App PAT"
            fi
          else
            git checkout -- .github/workflows/scheduler.yml 2>/dev/null || true
          fi
          # DATA — commit + push generated state.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: scheduler run $(date -u +%Y-%m-%dT%H-%M)"
            # Two scheduler runs can overlap (cancel-in-progress: false lets a
            # manual run race a scheduled one).  A rebase conflict on the
            # shared state files (run-log.jsonl etc.) is expected then — drop
            # the local commit (the OTHER run pushed equivalent state) and
            # let the next heartbeat produce a fresh commit.
            git pull --rebase origin main 2>/dev/null || {
              echo "rebase conflict (concurrent run) — dropping local commit, remote already has it"
              git rebase --abort 2>/dev/null || git reset --hard origin/main 2>/dev/null || true
            }
            git push || { echo "push failed (remote moved) — will retry next heartbeat"; }
          fi

      # Zero-day alert: after 12:00 UTC, if the UTC day has NO collected
      # records at all, open (or bump) a GitHub issue so a silent pipeline
      # failure is impossible to miss.  Idempotent — skips when an open
      # alert for today already exists.
      - name: Zero-day alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(date -u +%H); TODAY=$(date -u +%Y-%m-%d)
          N=$(ls data/collections/data-set/ 2>/dev/null | grep -c "^${TODAY}" || true)
          if [ "$H" -lt 12 ] || [ "${N:-0}" -gt 0 ]; then
            echo "ok: ${N:-0} records today (or before noon) — no alert"
            exit 0
          fi
          TITLE="[alert] No data collected today (${TODAY})"
          EXISTS=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"${TODAY}\"" --json number --jq 'length' 2>/dev/null || echo 1)
          if [ "${EXISTS:-1}" -gt 0 ]; then
            echo "open alert for ${TODAY} already exists — skipping"
            exit 0
          fi
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --label "alert" 2>/dev/null || \
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body "Today's scheduler runs produced **0 records**. Check the latest [scheduler runs](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/scheduler.yml) — likely every provider is rate-limited/quarantined or the sources failed. The heartbeat retries until midnight UTC." || \
            echo "issue create failed"

      - name: Weekly dataset tag
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          if [ -z "${BOT_PAT:-}" ]; then
            echo "no BOT_PAT — skipping weekly tag"
            exit 0
          fi
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git remote set-url origin "https://x-access-token:${BOT_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          TODAY=$(date -u +%Y-%m-%d)
          LAST=$(git tag --sort=-creatordate | head -1 || true)
          if [ -z "$LAST" ]; then
            git tag "data-${TODAY}" && git push origin "data-${TODAY}" 2>/dev/null && echo "tagged data-${TODAY}" || echo "tag push failed"
          else
            LASTD="${LAST#data-}"
            if [ "${LASTD#????-??-??}" != "" ] || [ -z "$LASTD" ]; then
              git tag "data-${TODAY}" && git push origin "data-${TODAY}" 2>/dev/null && echo "tagged data-${TODAY}" || echo "tag push failed"
            else
              SECS_LAST=$(date -u -d "$LASTD" +%s 2>/dev/null || echo 0)
              SECS_NOW=$(date -u +%s)
              if [ $((SECS_NOW - SECS_LAST)) -ge 604800 ]; then
                git tag "data-${TODAY}" && git push origin "data-${TODAY}" 2>/dev/null && echo "tagged data-${TODAY}" || echo "tag push failed"
              else
                echo "last tag ${LAST} is newer than 7 days — skipping"
              fi
            fi
          fi
