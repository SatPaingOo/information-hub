name: scheduler

on:
  schedule:
    # HEARTBEAT — every 15 min, the pipeline checks data/state/schedule.json
    # and runs the due phase(s).  This is what drives "keep collecting until
    # the daily target is met": after a rate-limited run the next-run time is
    # persisted in schedule.json and the next heartbeat fires it.  Works with
    # the plain GitHub App token (no BOT_PAT needed for data commits).
    - cron: "0 1 3 9 *"
    # SAFETY fallback — daily 01:00 UTC. Never rewritten; keeps the system
    # alive if the heartbeat schedule goes stale.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force_phase:
        description: "Force a phase now (empty = follow schedule)"
        required: false
        default: ""
        type: choice
        options: ["", "collect", "check"]

permissions:
  contents: write              # allow the bot to commit generated data

# NOTE: the GitHub App token CANNOT modify .github/workflows/*.yml.
# To enable the dynamic cron rewrite, add a `BOT_PAT` secret (fine-grained
# PAT with "Contents: read+write" on this repo) — the commit step uses it
# when present. Without it, data commits still work and the daily-01:00
# safety cron drives the runs (dynamic cron stays at its placeholder).

concurrency:
  group: scheduler
  cancel-in-progress: false    # one scheduler job at a time (git safety)

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run scheduler (due phases + cron update)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          FP="${{ github.event.inputs.force_phase }}"
          if [ -n "$FP" ]; then
            python -m src.run.scheduler --force-phase "$FP"
          else
            python -m src.run.scheduler
          fi

      - name: Commit generated data
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          git config user.name "information-hub[bot]"
          git config user.email "information-hub[bot]@users.noreply.github.com"
          # CRON CHANGE: only pushable by a REAL PAT (classic ghp_ / fine-
          # grained) with Contents write.  The GitHub App token (gho_) and
          # GitHub App secrets CANNOT push workflow files — if BOT_PAT is a
          # GitHub App token (or unset), discard the cron rewrite and let the
          # */15 heartbeat drive runs.  When a real PAT is set, push the cron
          # change FIRST so it lands before the data commit.
          if [ -n "${BOT_PAT:-}" ]; then
            # actions/checkout sets http.https://github.com/.extraheader to the
            # GitHub App token, which OVERRIDES the URL credentials below — the
            # push would still use the App token and GitHub would refuse the
            # workflow-file change.  Drop it so BOT_PAT is actually used.
            git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${BOT_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            git add .github/workflows/scheduler.yml
            if ! git diff --cached --quiet; then
              git commit -m "chore: scheduler cron -> $(grep -oE 'cron: \"[^\"]*\"' .github/workflows/scheduler.yml | head -1)" 2>/dev/null || true
              git push origin main 2>/dev/null || echo "cron push failed — workflow files need a non-App PAT"
            fi
          else
            git checkout -- .github/workflows/scheduler.yml 2>/dev/null || true
          fi
          # DATA — commit + push generated state.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: scheduler run $(date -u +%Y-%m-%dT%H-%M)"
            # Two scheduler runs can overlap (cancel-in-progress: false lets a
            # manual run race a scheduled one).  A rebase conflict on the
            # shared state files (run-log.jsonl etc.) is expected then — drop
            # the local commit (the OTHER run pushed equivalent state) and
            # let the next heartbeat produce a fresh commit.
            git pull --rebase origin main 2>/dev/null || {
              echo "rebase conflict (concurrent run) — dropping local commit, remote already has it"
              git rebase --abort 2>/dev/null || git reset --hard origin/main 2>/dev/null || true
            }
            git push || { echo "push failed (remote moved) — will retry next heartbeat"; }
          fi
