name: daily-collect-check

on:
  schedule:
    # Collect: 01:00 UTC (~06:30 Myanmar) · Check: 13:00 UTC (~18:30 Myanmar)
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to run (collect | check | both)"
        required: true
        default: both
        type: choice
        options: [both, collect, check]

permissions:
  contents: write              # allow the bot to commit generated data

concurrency:
  group: daily-collect-check
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.phase == 'both' || github.event.inputs.phase == 'collect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run collect phase
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python -m src.main --phase collect

      - name: Commit generated data
        run: |
          git config user.name "information-hub[bot]"
          git config user.email "information-hub[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily collect $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          fi

  check:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.phase == 'both' || github.event.inputs.phase == 'check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [collect]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run check phase
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python -m src.main --phase check

      - name: Commit generated data
        run: |
          git config user.name "information-hub[bot]"
          git config user.email "information-hub[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily check $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          fi
