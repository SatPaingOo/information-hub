<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — Information Hub</title>
  <meta name="description" content="A deep-dive intelligence briefing from the Information Hub library." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗞️</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="./" class="flex items-center gap-2 font-bold text-slate-900"><span class="text-xl">🗞️</span><span>Information Hub</span></a>
      <div class="flex items-center gap-3 text-sm">
        <a href="./" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">Library</a>
        <a href="./graph.html" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">Graph</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <!-- loading / error -->
    <div id="loading" class="text-center py-20 text-slate-400">Loading article…</div>
    <div id="error" class="hidden text-center py-20 text-red-500"></div>

    <article id="article" class="hidden">
      <!-- badges -->
      <div id="badges" class="flex flex-wrap gap-2 mb-4"></div>
      <h1 id="title" class="text-3xl sm:text-4xl font-bold leading-tight mb-4"></h1>
      <div id="meta" class="text-sm text-slate-500 mb-6"></div>

      <div id="tldr" class="bg-indigo-50 border-l-4 border-indigo-400 rounded-r-lg p-4 mb-8 text-slate-700"></div>

      <div id="body" class="prose prose-slate max-w-none space-y-8"></div>

      <!-- entities -->
      <section id="entities-sec" class="mt-10">
        <h2 class="text-xl font-bold mb-3">Entities</h2>
        <div id="entities" class="flex flex-wrap gap-2"></div>
      </section>

      <!-- related -->
      <section id="related-sec" class="mt-10">
        <h2 class="text-xl font-bold mb-3">Related briefings</h2>
        <div id="related" class="space-y-2"></div>
      </section>

      <!-- provenance / grounding / review -->
      <section class="mt-12 border-t border-slate-200 pt-6 text-xs text-slate-500 space-y-1">
        <div id="provenance"></div>
      </section>
    </article>

    <div class="text-center mt-10">
      <a href="./" class="text-sm text-indigo-600 hover:underline">← Back to library</a>
    </div>
  </main>

  <footer class="border-t border-slate-200 py-8 text-center text-xs text-slate-400 bg-white mt-10">
    Information Hub · data licensed CC BY-NC 4.0 · generated by autonomous AI pipeline
  </footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/article.js"></script>
</body>
</html>
