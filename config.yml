# information-hub — configuration
# Taxonomy engine: layers (hierarchical), collections, sources, quotas.
# V3: multi-provider (roles: collect/check) + quality thresholds + 2-phase runs.
# Editable directly on GitHub (no code changes required).
#
# ---- Providers (fully auto — only providers with env keys are enabled) ----
providers:
  groq:
    enabled: true
    keys_env: GROQ_API_KEY            # single key env name
    role: collect                     # deep-dive generation
    format: openai                    # /chat/completions
    models: [llama-3.3-70b-versatile, llama-3.1-8b-instant]   # fallback order
    budget: { max_items: 2, max_calls: 10 }
  openrouter:
    enabled: true
    keys_env: OPENROUTER_API_KEY
    role: collect
    format: openai
    discover: free_models             # runtime auto-discover free models (no hardcode)
    budget: { max_items: 2, max_calls: 10 }
  gemini:
    enabled: true
    keys_env: GEMINI_API_KEYS         # comma-separated multi-key
    role: check                       # search-grounding verification ONLY
    format: google
    models: [gemini-3.5-flash-lite, gemini-3.5-flash]   # current-gen (2.5-flash retired for new users)
    search_tool: google_search        # enable web-search grounding
    budget: { max_items: 10, max_calls: 15 }

# ---- Quality engine (phase check) ----
quality:
  reject_threshold: 0.5               # grounding score below → pending_review
  max_ai_verify_per_run: 10           # Gemini free tier search budget cap

# ---- Run phases ----
run:
  phases: [collect, check]

gemini:                               # legacy keys (gemini.* still used by prompts)
  model: gemini-3.5-flash-lite
  temperature: 0.4
  max_output_tokens: 2048
  retries: 2

storage:
  data_dir: data
  max_daily_items_total: 6            # multi-provider capacity

# Classification layers — hierarchical (add / remove / edit freely)
taxonomy:
  regions:
    asia:     [myanmar, thailand, china]
    americas: [us, canada]
    europe:   [uk, germany]
  topics:
    ai-ml:        [llm, agents, vision]
    geopolitics:  [conflict, trade]
    dev-oss:      []
  categories:
    economy:  [macro, trade, fintech]
    society:  [human, education, health]
    industry: [product, open-source]
  content_types: [article, briefing, analysis, digest]

# Optional static cross-layer relations (config-defined)
relations:
  - { from: myanmar, to: geopolitics, type: relates }
  - { from: myanmar, to: economy,    type: relates }
  - { from: llm,     to: agents,     type: related }
  - { from: us,      to: dev-oss,    type: relates }

# Collections — key-value: source group + default classification + quotas
collections:
  myanmar-news:
    enabled: true
    priority: 3
    frequency: daily
    content_type: digest
    topics: [geopolitics, economy]
    regions: [myanmar]
    categories: [policy, industry]
    primary_layer: region
    sources:
      - { type: rss, url: "https://www.irrawaddy.com/feed" }
      - { type: rss, url: "https://myanmar-now.org/en/feed/" }
    limits: { max_candidates: 12, max_daily_items: 2 }

  ai-research:
    enabled: true
    priority: 2
    frequency: daily
    content_type: briefing
    topics: [ai-ml]
    regions: [global]
    categories: [research]
    primary_layer: topic
    sources:
      - { type: arxiv, query: "cat:cs.AI OR cat:cs.LG" }
      - { type: rss, url: "https://techcrunch.com/category/artificial-intelligence/feed/" }
    limits: { max_candidates: 12, max_daily_items: 1 }

  us-tech:
    enabled: true
    priority: 1
    frequency: every-2-days
    content_type: article
    topics: [ai-ml, dev-oss]
    regions: [us]
    categories: [product, open-source]
    primary_layer: topic
    sources:
      - { type: github, topic: "machine-learning", since: "daily" }
      - { type: rss, url: "https://www.theverge.com/rss/index.xml" }
    limits: { max_candidates: 10, max_daily_items: 1 }

# Deep-dive content requirements
content:
  min_words: 500
  target_words: [600, 1000]
  fulltext_max_chars: 6000
  similarity_window: 30
  similarity_threshold: 0.55
