# information-hub — configuration
# Taxonomy engine: layers (hierarchical), collections, sources, quotas.
# V6+: token-aware daily budgets + dynamic run control (no fixed run times).
# Editable directly on GitHub (no code changes required).

# ---- Providers (fully auto — only providers with env keys are enabled) ----
# Token-aware daily budgets (per provider, auto-reset each UTC day):
#   max_daily_items   — daily item ceiling
#   max_daily_tokens  — daily token ceiling (counted from API usage)
#   max_output_tokens — per-call output cap (free tiers cap output too)
providers:
  groq:
    enabled: true
    keys_env: GROQ_API_KEY            # single key env name
    role: collect                     # deep-dive generation
    format: openai                    # /chat/completions
    # Current Groq free-tier models (llama-3.3-70b-versatile / llama-3.1-8b
    # were retired — 404). gpt-oss models are the current free generation.
    models: [openai/gpt-oss-120b, openai/gpt-oss-20b]   # fallback order
    # ~4k tokens per item (select ~1.5k + deep-dive ~2.5k) × 4 items
    budget: { max_daily_items: 4, max_daily_tokens: 30000, max_output_tokens: 2048 }
  openrouter:
    enabled: true
    keys_env: OPENROUTER_API_KEY
    role: collect
    format: openai
    # AUTO-INTEGRATION: discover free_models = every free JSON-capable model
    # joins the pool automatically (new free models are found + ping-scouted
    # + ranked by measured success + quarantined when they keep failing).
    # models = seed list (proven-good, tried first); blocklist = never join.
    discover: free_models
    models:
      - nvidia/nemotron-3-super-120b-a12b:free
      - poolside/laguna-s-2.1:free
      - poolside/laguna-xs-2.1:free
      - cohere/north-mini-code:free
    blocklist:
      # saturated 429 models (tested 08-18..08-21 — always rate-limited)
      - google/gemma-4-31b-it:free
      - z-ai/glm-5.2:free
      - google/gemma-4-26b-a4b-it:free
      # non-JSON / JSON-invalid response models
      - google/lyria-3-clip-preview
      - google/lyria-3-pro-preview
      # reasoning models — openrouter counts reasoning tokens in output,
      # a 34k-token response blew the daily budget in one call (08-21)
      - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      - stealth/ox-alpha
    # ~4k tokens per item × 6 items; 4096 output cap stops mid-JSON truncation
    budget: { max_daily_items: 6, max_daily_tokens: 100000, max_output_tokens: 4096 }
  gemini:
    enabled: true
    keys_env: GEMINI_API_KEYS         # comma-separated multi-key
    role: check                       # search-grounding verification ONLY
    format: google
    models: [gemini-3.5-flash-lite, gemini-3.5-flash]   # current-gen (2.5-flash retired for new users)
    search_tool: google_search        # enable web-search grounding
    budget: { max_daily_items: 10, max_daily_tokens: 5000, max_output_tokens: 2048 }

# ---- Quality engine (phase check) ----
quality:
  reject_threshold: 0.5               # grounding score below → pending_review
  max_ai_verify_per_run: 10           # Gemini free tier search budget cap

# ---- Run control (dynamic scheduler) ----
run:
  phases: [collect, check]
  max_job_minutes: 25                 # Actions 30-min timeout အောက်မှာ ရပ်ဖို့
  heartbeat_minutes: 15               # scheduler cron interval (schedule.json due စစ်)
  cooldown_base_seconds: 30           # exponential backoff base for cooldowns

gemini:                               # legacy keys (gemini.* still used by prompts/retries)
  model: gemini-3.5-flash-lite
  temperature: 0.4
  max_output_tokens: 2048
  retries: 2

storage:
  data_dir: data
  max_daily_items_total: 10           # free-tier daily capacity (Groq 4 + OpenRouter 6)

# ---- Targets (daily content goals — free tier can produce ~10/day) ----
targets:
  total_per_day: 10
  collections:
    world-news: 3
    tech-news: 3
    politics: 2
    products: 2

# Classification layers — hierarchical (add / remove / edit freely)
taxonomy:
  regions:
    asia:     [myanmar, thailand, china]
    americas: [us, canada]
    europe:   [uk, germany]
  topics:
    ai-ml:        [llm, agents, vision]
    geopolitics:  [conflict, trade]
    world:        []
    politics:     []
    products:     []
    dev-oss:      []
  categories:
    economy:  [macro, trade, fintech]
    society:  [human, education, health]
    industry: [product, open-source]
  content_types: [article, briefing, analysis, digest]

# Optional static cross-layer relations (config-defined)
relations:
  - { from: llm,     to: agents,     type: related }
  - { from: us,      to: dev-oss,    type: relates }

# Collections — key-value: source group + default classification + quotas
#   priority  = ပိုစုတဲ့ကောင် (များလေ quota အရင်ရလေ)
#   frequency = daily | every-2-days | weekly
collections:
  world-news:
    enabled: true
    priority: 3
    frequency: daily
    content_type: digest
    topics: [world, geopolitics]
    regions: [global]
    categories: [policy, industry]
    sources:
      - { type: rss, url: "https://feeds.bbci.co.uk/news/world/rss.xml" }
      - { type: rss, url: "https://www.aljazeera.com/xml/rss/all.xml" }
    limits: { max_candidates: 8, max_daily_items: 3 }

  tech-news:
    enabled: true
    priority: 2
    frequency: daily
    content_type: briefing
    topics: [ai-ml, dev-oss]
    regions: [global, us]
    categories: [research, product, open-source]
    sources:
      - { type: arxiv, query: "cat:cs.AI OR cat:cs.LG" }
      - { type: rss, url: "https://techcrunch.com/feed/" }
      - { type: rss, url: "https://www.theverge.com/rss/index.xml" }
    limits: { max_candidates: 8, max_daily_items: 3 }

  politics:
    enabled: true
    priority: 2
    frequency: daily
    content_type: digest
    topics: [politics, geopolitics]
    regions: [global]
    categories: [policy]
    sources:
      - { type: rss, url: "https://feeds.bbci.co.uk/news/politics/rss.xml" }
      - { type: rss, url: "https://www.politico.eu/feed/" }
    limits: { max_candidates: 8, max_daily_items: 2 }

  products:
    enabled: true
    priority: 1
    frequency: daily
    content_type: article
    topics: [products]
    regions: [global, us]
    categories: [product]
    sources:
      - { type: rss, url: "https://www.producthunt.com/feed" }
      - { type: rss, url: "https://techcrunch.com/gadgets/feed/" }
    limits: { max_candidates: 8, max_daily_items: 2 }

# Deep-dive content requirements
content:
  min_words: 500
  target_words: [600, 1000]
  fulltext_max_chars: 6000
  similarity_window: 30
  similarity_threshold: 0.55
  near_dup_threshold: 0.68      # containment ratio that blocks a pick as near-duplicate
